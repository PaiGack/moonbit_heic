# MoonBit 工程骨架的 CI。
#
# 每条分支的 push 和 PR 跑同一组检查：类型检查（警告即失败）、单测、
# 公开接口无漂移、格式、以及对拍脚本自身的 node 自测。
#
# 环境镜像用官方的 debian 基础镜像：moon 的 linux-x86_64 产物是 glibc 的，
# 而 curlimages/curl 之类是 alpine/musl，装不上。moon 装到 $HOME/.moon/bin，
# 每个 stage 各 export 一次 PATH。

.moonbit: &moonbit
  docker:
    image: debian:stable-slim

"**":
  push:
    - <<: *moonbit
      stages:
        - name: install moonbit
          script:
            - apt-get update -qq
            - apt-get install -y -qq --no-install-recommends curl ca-certificates git nodejs npm >/dev/null
            - curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
            - export PATH="$HOME/.moon/bin:$PATH"
            - moon version --all

        - name: moon check --deny-warn
          script:
            - export PATH="$HOME/.moon/bin:$PATH"
            - moon check --deny-warn

        - name: moon test
          script:
            - export PATH="$HOME/.moon/bin:$PATH"
            - moon test

        # moon info 会重写 .mbti；重写后仍有 diff，说明公开接口变了却没提交。
        - name: moon info
          script:
            - export PATH="$HOME/.moon/bin:$PATH"
            - moon info
            - |
              if ! git diff --exit-code -- '*.mbti'; then
                echo "公开接口有变动：请本地执行 moon info 并提交 .mbti"
                exit 1
              fi

        - name: moon fmt --check
          script:
            - export PATH="$HOME/.moon/bin:$PATH"
            - moon fmt --check

        - name: parity harness self-test
          script:
            - node --test tools/parity/
            - node tools/parity/dump.mjs tools/fixtures/empty_dump.json tools/fixtures/empty_dump.json

        # The M3 golden bitstreams are generated from the committed tables;
        # a hand edit that drifts them would make the decoder pass its own
        # fixtures while disagreeing with the upstream.
        - name: m3 golden fixtures are current
          script:
            # The generators compare against a moon fmt-formatted copy of the
            # golden, so moon must be on PATH here too (as in other stages).
            - export PATH="$HOME/.moon/bin:$PATH"
            - node tools/gen_m3_golden.mjs --check
            - node tools/gen_recon_golden.mjs --check
            # Residual golden is Go-encoder truth; crosscheck re-derives all
            # 122488 values from an independent JS transcription (no Go/network).
            - node tools/gen_residual_golden.mjs --check
            - node tools/crosscheck_residual.mjs
            # Loop-filter golden is real upstream Go deblock()/applySAO()
            # truth; crosscheck re-derives all 126834 values from an
            # independent JS transcription (no Go/network).
            - node tools/gen_loopfilter_golden.mjs --check
            - node tools/crosscheck_loopfilter.mjs
            # CTU-level CABAC syntax (7.3.8.2..7.3.8.10) golden is real
            # upstream Go pure derivations + cabacWriter/ctuDecoder round
            # trips; crosscheck re-derives all 1739 values from an independent
            # JS transcription (no Go/network).
            - node tools/gen_syntax_golden.mjs --check
            - node tools/crosscheck_syntax.mjs
            # Geometry + single-block reconstruction: real upstream Go
            # buildMinTbAddr/available/predictQP/gatherRef and reconstructPlane
            # (real residual bitstreams -> pixels). crosscheck re-derives the
            # geometry half from an independent JS transcription; the MoonBit
            # port reproduces the reconstruction pixels sample for sample.
            - node tools/gen_reconstruct_golden.mjs --check
            - node tools/crosscheck_reconstruct.mjs
            # Whole-frame CTU reconstruction: real upstream Go DecodeNAL
            # output (asserted against the shipped *_ref.yuv) for 13 small
            # I frames. The MoonBit decode_i_frame reproduces every YUV
            # sample; crosscheck pins the stream/YUV bytes and the 300-TB
            # trace shape independently (no Go/network).
            - node tools/gen_frame_golden.mjs --check
            - node tools/crosscheck_frame.mjs
            # Frame-level 8.7.2 deblocking: real upstream Go DecodeNAL
            # output WITH/WITHOUT the loop filter for 6 single-slice I frames
            # (1 with deblocking genuinely active), plus the captured real
            # ctuDecoder boundary state. MoonBit decode_i_frame reproduces
            # the filtered YUV byte for byte; crosscheck re-derives the
            # fingerprints, changed-sample count and block-state invariants.
            - node tools/gen_deblock_golden.mjs --check
            - node tools/crosscheck_deblock.mjs
            # Remaining M3 tools: SAO (syntax + genuinely-active application),
            # scaling lists, PCM, transform skip, transquant bypass,
            # cu_chroma_qp_offset, plus 720p/1080p/4032x3024 scale checks.
            # Real upstream Go decoder first-picture YUV; crosscheck re-derives
            # every fingerprint / checksum / probe independently (no Go/network).
            - node tools/gen_frame2_golden.mjs --check
            - node tools/crosscheck_frame2.mjs
            # 7.4.5 scaling-list factors: real upstream Go sps.scalingList +
            # factors(), crosscheck re-derives all 16384 values from an
            # independent JS transcription.
            - node tools/gen_scaling_golden.mjs --check
            - node tools/crosscheck_scaling.mjs

        # M5 end-to-end smoke: one 16x16 upstream-Go I frame, wrapped in a
        # minimal HEIC, decoded by the MoonBit CLI and compared to an
        # independent JS BT.709 reference (PSNR >= 45dB), plus the four
        # documented exit codes. The bench fixture is checked for drift so a
        # hand edit cannot make the backend timing report stale.
        - name: m5 e2e smoke
          script:
            - export PATH="$HOME/.moon/bin:$PATH"
            - node --test tools/e2e/
            - node tools/e2e/gen_bench_fixture.mjs --check
            - node tools/e2e/run.mjs --smoke --out tools/e2e/report.json

        # M4 end-to-end: a real M3 I-frame HEVC stream is wrapped in a minimal
        # HEIC, decoded through M1/M3, colour-converted and written as PNG
        # (8/16-bit) and JPEG. The self-test checks the emitted containers
        # and their declared geometry without an external image library.
        - name: m4 cli end-to-end
          script:
            - export PATH="$HOME/.moon/bin:$PATH"
            - node tools/m4_cli_selftest.mjs

